send_message:
  name: Gửi tin nhắn
  description: Gửi tin nhắn văn bản qua tài khoản Telegram, Discord, Signal hoặc LINE Official Account đã cấu hình. SIM A7670C-LANS không hỗ trợ tin nhắn.
  fields:
    to:
      name: Người nhận
      description: Telegram dùng username, số điện thoại hoặc ID; Discord dùng ID kênh/người dùng, #ten-kenh hoặc @username; Signal dùng số E.164, group.* hoặc username; LINE dùng user/group/room ID (U.../C.../R...).
      required: true
      selector:
        text:
    message:
      name: Nội dung
      description: Nội dung tin nhắn.
      required: true
      selector:
        text:
          multiline: true
    account:
      name: Tài khoản gửi
      description: ID, số điện thoại hoặc tên tài khoản Telegram, ID Discord (dc_...), ID Signal (sg_...) hoặc ID LINE (ln_...). Bỏ trống để dùng tài khoản online theo thứ tự Telegram, Discord, Signal, LINE. ID SIM (sm_...) bị từ chối vì SIM chỉ gọi thoại.
      selector:
        text:
    parse_mode:
      name: Định dạng
      description: Cách Telegram hiểu nội dung.
      selector:
        select:
          options:
            - label: Tự động
              value: ""
            - label: Văn bản thuần
              value: plain
            - label: Markdown
              value: markdown
            - label: HTML
              value: html
    silent:
      name: Gửi im lặng
      description: Gửi không kèm thông báo âm thanh.
      default: false
      selector:
        boolean:

send_tts:
  name: Gửi tin nhắn thoại
  description: Tạo giọng nói từ văn bản và gửi voice message Telegram hoặc file audio Discord/Signal. LINE và SIM không hỗ trợ gửi TTS cục bộ; SIM chỉ phát TTS trong cuộc gọi.
  fields:
    to:
      name: Người nhận
      required: true
      selector:
        text:
    message:
      name: Nội dung đọc
      required: true
      selector:
        text:
          multiline: true
    account:
      name: Tài khoản gửi
      description: ID, số điện thoại hoặc tên tài khoản Telegram, ID Discord (dc_...), ID Signal (sg_...) hoặc ID LINE (ln_...). Bỏ trống để dùng tài khoản online theo thứ tự Telegram, Discord, Signal, LINE. ID SIM (sm_...) bị từ chối vì SIM chỉ gọi thoại.
      selector:
        text:
    voice:
      name: Giọng đọc
      description: Mã giọng Edge TTS, ví dụ vi-VN-HoaiMyNeural.
      selector:
        text:
    rate:
      name: Tốc độ
      description: Tốc độ đọc, ví dụ +0% hoặc -10%.
      selector:
        text:
    caption:
      name: Chú thích
      selector:
        text:

call:
  name: Gọi và phát TTS
  description: Gọi P2P Telegram hoặc gọi thoại thật qua SIM A7670C-LANS, chờ người nhận nghe máy rồi phát nội dung TTS.
  fields:
    to:
      name: Người nhận
      required: true
      selector:
        text:
    message:
      name: Nội dung đọc
      required: true
      selector:
        text:
          multiline: true
    account:
      name: Tài khoản gửi
      description: ID, số điện thoại hoặc tên tài khoản Telegram, hoặc ID SIM (sm_...). Bỏ trống để dùng tài khoản Telegram online đầu tiên; SIM chỉ dùng khi chọn rõ ID.
      selector:
        text:
    voice:
      name: Giọng đọc
      selector:
        text:
    rate:
      name: Tốc độ
      selector:
        text:
    ring_timeout:
      name: Thời gian đổ chuông
      description: Giây chờ người nhận bấm nghe máy.
      default: 45
      selector:
        number:
          min: 10
          max: 180
          unit_of_measurement: s
    wait:
      name: Chờ cuộc gọi kết thúc
      description: Chặn service cho đến khi cuộc gọi kết thúc hoặc hết wait_seconds.
      default: false
      selector:
        boolean:
    wait_seconds:
      name: Thời gian chờ tối đa
      default: 60
      selector:
        number:
          min: 5
          max: 180
          unit_of_measurement: s

ring:
  name: Chuông báo động
  description: Telegram hoặc SIM gọi thoại lặp và phát TTS khi nghe máy; Discord/Signal gửi voice TTS lặp qua tài khoản, tùy chọn gửi kèm tin nhắn. SIM không gửi tin nhắn kèm.
  fields:
    to:
      name: Người nhận
      required: true
      selector:
        text:
    message:
      name: Nội dung đọc
      required: true
      selector:
        text:
          multiline: true
    account:
      name: Tài khoản gửi
      description: ID, số điện thoại hoặc tên tài khoản Telegram, hoặc ID SIM (sm_...). Telegram/SIM gọi thoại; Discord/Signal gửi voice TTS lặp; LINE không hỗ trợ chuông. Bỏ trống để dùng tài khoản online đầu tiên.
      selector:
        text:
    voice:
      name: Giọng đọc
      selector:
        text:
    rate:
      name: Tốc độ
      selector:
        text:
    attempts:
      name: Số lần lặp
      description: Telegram/SIM gọi lặp; Discord/Signal gửi voice TTS lặp.
      default: 2
      selector:
        number:
          min: 1
          max: 10
    interval:
      name: Khoảng nghỉ giữa các lần
      default: 5
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: s
    ring_timeout:
      name: Thời gian đổ chuông mỗi lần
      default: 30
      selector:
        number:
          min: 10
          max: 180
          unit_of_measurement: s
    send_message:
      name: Gửi kèm tin nhắn
      default: true
      selector:
        boolean:

hangup:
  name: Kết thúc cuộc gọi/chuông
  description: Hủy một cuộc gọi Telegram/SIM, chuông TTS hoặc toàn bộ hoạt động đang chạy.
  fields:
    call_id:
      name: ID cuộc gọi
      description: Bỏ trống để kết thúc mọi cuộc gọi đang hoạt động.
      selector:
        text:
    account:
      name: Tài khoản
      description: ID, số điện thoại hoặc tên tài khoản cần lọc.
      selector:
        text:

send_photo:
  name: Gửi ảnh
  description: Gửi ảnh qua Telegram, Discord hoặc Signal từ URL, dữ liệu ảnh hoặc file trong /data/media; LINE chỉ nhận URL HTTPS công khai; SIM không hỗ trợ ảnh.
  fields:
    to:
      name: Người nhận
      description: Telegram dùng username, số điện thoại hoặc ID; Discord dùng ID kênh/người dùng, #ten-kenh hoặc @username; Signal dùng số E.164, group.* hoặc username; LINE dùng user/group/room ID (U.../C.../R...).
      required: true
      selector:
        text:
    image:
      name: Ảnh
      description: URL http(s) truy cập được từ Internet, data URL base64 hoặc đường dẫn file trong /data/media.
      required: true
      selector:
        text:
    account:
      name: Tài khoản gửi
      description: ID, số điện thoại hoặc tên tài khoản Telegram, ID Discord (dc_...), ID Signal (sg_...) hoặc ID LINE (ln_...). Bỏ trống để dùng tài khoản online theo thứ tự Telegram, Discord, Signal, LINE. ID SIM (sm_...) bị từ chối vì SIM chỉ gọi thoại.
      selector:
        text:
    caption:
      name: Chú thích
      description: Nội dung hiển thị dưới ảnh.
      selector:
        text:
    silent:
      name: Gửi im lặng
      description: Gửi không kèm thông báo âm thanh.
      default: false
      selector:
        boolean:
