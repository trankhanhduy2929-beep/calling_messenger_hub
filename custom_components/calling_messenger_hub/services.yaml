send_message:
  name: Gửi tin nhắn
  description: Gửi tin nhắn văn bản hoặc SMS qua Telegram, Discord, Signal, LINE Official Account, Zalo cá nhân hoặc SIM 4G.
  fields:
    to:
      name: Người nhận
      description: Telegram dùng username, số điện thoại hoặc ID; Discord dùng ID kênh/người dùng, #ten-kenh hoặc @username; Signal dùng số E.164, group.* hoặc username; LINE dùng user/group/room ID (U.../C.../R...); Zalo dùng UID người dùng hoặc ID nhóm; SIM dùng số điện thoại.
      required: true
      selector:
        text:
    message:
      name: Nội dung
      description: Nội dung tin nhắn. SMS dài được tự chia thành nhiều phần, tối đa 1000 ký tự.
      required: true
      selector:
        text:
          multiline: true
    account:
      name: Tài khoản gửi
      description: ID, số điện thoại hoặc tên tài khoản Telegram, ID Discord (dc_...), ID Signal (sg_...), ID LINE (ln_...), ID Zalo (zl_...) hoặc ID SIM (sm_...). Bỏ trống để add-on tự chọn tài khoản online; nên chọn rõ ID khi có nhiều dịch vụ. SIM gửi SMS đến số điện thoại.
      selector:
        text:
    parse_mode:
      name: Định dạng
      description: Cách Telegram hiểu nội dung.
      selector:
        select:
          options:
            - label: Tự động
              value: ""
            - label: Văn bản thuần
              value: plain
            - label: Markdown
              value: markdown
            - label: HTML
              value: html
    silent:
      name: Gửi im lặng
      description: Gửi không kèm thông báo âm thanh.
      default: false
      selector:
        boolean:

send_tts:
  name: Gửi tin nhắn thoại
  description: Tạo giọng nói từ văn bản và gửi voice message qua Telegram, Discord, Signal hoặc Zalo. LINE và SIM không hỗ trợ gửi TTS cục bộ; SIM chỉ phát TTS trong cuộc gọi.
  fields:
    to:
      name: Người nhận
      description: Telegram dùng username hoặc ID; Discord dùng ID kênh/người dùng; Signal dùng số E.164 hoặc group.*; Zalo dùng UID người dùng hoặc ID nhóm.
      required: true
      selector:
        text:
    message:
      name: Nội dung đọc
      required: true
      selector:
        text:
          multiline: true
    account:
      name: Tài khoản gửi
      description: ID, số điện thoại hoặc tên tài khoản Telegram, ID Discord (dc_...), ID Signal (sg_...), ID LINE (ln_...) hoặc ID Zalo (zl_...). Bỏ trống để add-on tự chọn tài khoản online; nên chọn rõ ID khi có nhiều dịch vụ. ID SIM (sm_...) chỉ hỗ trợ gọi thoại và SMS.
      selector:
        text:
    voice:
      name: Giọng đọc
      description: Mã giọng Edge TTS, ví dụ vi-VN-HoaiMyNeural.
      selector:
        text:
    rate:
      name: Tốc độ
      description: Tốc độ đọc, ví dụ +0% hoặc -10%.
      selector:
        text:
    caption:
      name: Chú thích
      selector:
        text:

call:
  name: Gọi và phát TTS
  description: Gọi P2P Telegram, gọi Zalo một chiều hoặc gọi cảnh báo TTS qua SIM A7670C-LANS. Telegram/SIM/Zalo chờ người nhận nghe máy rồi phát nội dung TTS; SIM/Zalo không truyền mic/loa hai chiều.
  fields:
    to:
      name: Người nhận
      description: Telegram dùng username hoặc ID; SIM dùng số điện thoại; Zalo dùng UID người dùng.
      required: true
      selector:
        text:
    message:
      name: Nội dung đọc
      description: Bắt buộc với Telegram/SIM. Với Zalo, bỏ trống nếu chỉ muốn đổ chuông; nhập nội dung để phát TTS sau khi người nhận nghe máy.
      required: false
      selector:
        text:
          multiline: true
    account:
      name: Tài khoản gửi
      description: ID, số điện thoại hoặc tên tài khoản Telegram, ID SIM (sm_...) hoặc ID Zalo (zl_...). Bỏ trống để dùng tài khoản Telegram online đầu tiên; SIM/Zalo chỉ dùng khi chọn rõ ID.
      selector:
        text:
    voice:
      name: Giọng đọc
      selector:
        text:
    rate:
      name: Tốc độ
      selector:
        text:
    ring_timeout:
      name: Thời gian đổ chuông
      description: Giây chờ người nhận bấm nghe máy.
      default: 45
      selector:
        number:
          min: 10
          max: 180
          unit_of_measurement: s
    wait:
      name: Chờ cuộc gọi kết thúc
      description: Chặn service cho đến khi cuộc gọi kết thúc hoặc hết wait_seconds.
      default: false
      selector:
        boolean:
    wait_seconds:
      name: Thời gian chờ tối đa
      default: 60
      selector:
        number:
          min: 5
          max: 180
          unit_of_measurement: s

ring:
  name: Chuông báo động
  description: Telegram hoặc SIM gọi cảnh báo TTS lặp và phát TTS khi nghe máy; Discord/Signal gửi voice TTS lặp qua tài khoản, tùy chọn gửi kèm tin nhắn. Zalo và LINE không hỗ trợ chuông TTS; SIM không gửi tin nhắn kèm.
  fields:
    to:
      name: Người nhận
      required: true
      selector:
        text:
    message:
      name: Nội dung đọc
      required: true
      selector:
        text:
          multiline: true
    account:
      name: Tài khoản gửi
      description: ID, số điện thoại hoặc tên tài khoản Telegram, hoặc ID SIM (sm_...). Telegram/SIM gọi thoại; Discord/Signal gửi voice TTS lặp; Zalo/LINE không hỗ trợ chuông. Bỏ trống để dùng tài khoản online đầu tiên.
      selector:
        text:
    voice:
      name: Giọng đọc
      selector:
        text:
    rate:
      name: Tốc độ
      selector:
        text:
    attempts:
      name: Số lần lặp
      description: Telegram/SIM gọi lặp; Discord/Signal gửi voice TTS lặp.
      default: 2
      selector:
        number:
          min: 1
          max: 10
    interval:
      name: Khoảng nghỉ giữa các lần
      default: 5
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: s
    ring_timeout:
      name: Thời gian đổ chuông mỗi lần
      default: 30
      selector:
        number:
          min: 10
          max: 180
          unit_of_measurement: s
    send_message:
      name: Gửi kèm tin nhắn
      default: true
      selector:
        boolean:

hangup:
  name: Kết thúc cuộc gọi/chuông
  description: Hủy một cuộc gọi Telegram/SIM/Zalo, chuông TTS hoặc toàn bộ hoạt động đang chạy.
  fields:
    call_id:
      name: ID cuộc gọi
      description: Bỏ trống để kết thúc mọi cuộc gọi đang hoạt động.
      selector:
        text:
    account:
      name: Tài khoản
      description: ID, số điện thoại hoặc tên tài khoản cần lọc.
      selector:
        text:

send_photo:
  name: Gửi ảnh
  description: Gửi ảnh qua Telegram, Discord, Signal hoặc Zalo từ URL, dữ liệu ảnh hoặc file trong /data/media; LINE chỉ nhận URL HTTPS công khai; SIM không hỗ trợ ảnh.
  fields:
    to:
      name: Người nhận
      description: Telegram dùng username, số điện thoại hoặc ID; Discord dùng ID kênh/người dùng, #ten-kenh hoặc @username; Signal dùng số E.164, group.* hoặc username; LINE dùng user/group/room ID (U.../C.../R...); Zalo dùng UID người dùng hoặc ID nhóm.
      required: true
      selector:
        text:
    image:
      name: Ảnh
      description: URL http(s) truy cập được từ Internet, data URL base64 hoặc đường dẫn file trong /data/media.
      required: true
      selector:
        text:
    account:
      name: Tài khoản gửi
      description: ID, số điện thoại hoặc tên tài khoản Telegram, ID Discord (dc_...), ID Signal (sg_...), ID LINE (ln_...) hoặc ID Zalo (zl_...). Bỏ trống để add-on tự chọn tài khoản online; nên chọn rõ ID khi có nhiều dịch vụ. ID SIM (sm_...) chỉ hỗ trợ gọi thoại và SMS.
      selector:
        text:
    caption:
      name: Chú thích
      description: Nội dung hiển thị dưới ảnh.
      selector:
        text:
    silent:
      name: Gửi im lặng
      description: Gửi không kèm thông báo âm thanh.
      default: false
      selector:
        boolean:

trigger_alert:
  name: Kích hoạt báo động
  description: Chạy một chính sách báo động đã lưu. Truyền policy_id hoặc tên chính sách chính xác.
  fields:
    policy_id:
      name: ID chính sách
      description: ID chính sách trong trung tâm báo động. Dùng thay cho tên khi cần ổn định.
      selector:
        text:
    name:
      name: Tên chính sách
      description: Tên chính sách chính xác nếu không có policy_id.
      selector:
        text:
    message:
      name: Lời thoại ghi đè
      description: Ghi đè lời thoại mặc định của chính sách.
      selector:
        text:
          multiline: true
    severity:
      name: Mức ưu tiên
      selector:
        select:
          options:
            - label: Thông tin
              value: info
            - label: Cảnh báo
              value: warning
            - label: Nghiêm trọng
              value: critical
    source:
      name: Nguồn
      description: Tên automation hoặc hệ thống tạo báo động.
      selector:
        text:
    dedupe_key:
      name: Khóa chống trùng
      description: Báo động đang chạy có cùng khóa sẽ không tạo thêm.
      selector:
        text:

acknowledge_alert:
  name: Xác nhận báo động
  description: Xác nhận đã nhận báo động và dừng leo thang.
  fields:
    alert_id:
      name: ID báo động
      required: true
      selector:
        text:
    by:
      name: Người xác nhận
      selector:
        text:

resolve_alert:
  name: Đánh dấu báo động đã xử lý
  description: Đánh dấu báo động đã xử lý và dừng chuỗi cuộc gọi.
  fields:
    alert_id:
      name: ID báo động
      required: true
      selector:
        text:
    by:
      name: Người xử lý
      selector:
        text:

cancel_alert:
  name: Hủy báo động
  description: Hủy báo động đang chạy và dừng cuộc gọi hoặc chuông hiện tại.
  fields:
    alert_id:
      name: ID báo động
      required: true
      selector:
        text:
    by:
      name: Người hủy
      selector:
        text:
